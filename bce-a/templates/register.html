<title>Register</title>
<link rel="stylesheet" href="{{url_for('static', filename='login.css')}}">
<form action="" method="post">
    <input type="email" name="user_email" placeholder="Email address">
    <input type="date" name="user_dob" placeholder="Date of birth">
    <input type="number" name="user_phone" placeholder="Phone number">
    <input type="text" name="user_lname" placeholder="Last name">
    <input type="text" name="user_fname" placeholder="First name">
    <input type="text" name="user_postcode" placeholder="Postcode">
    <input type="text" name="user_address" placeholder="Address">
    <input type="password" name="user_password" placeholder="Password">
    <input type="number" name="role_id" placeholder="Role ID">
    <input type="submit">
</form>
<a href="{{url_for('login')}}">login</a>
